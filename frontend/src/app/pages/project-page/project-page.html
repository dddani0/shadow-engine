<div class="container-fluid">
  <div class="container">
    <h1>Editor</h1>
    <div class="btnRow">
      <a [routerLink]="['/play', projectId()]"><button class="primary">Play</button></a>
      <button [disabled]="loading()" (click)="refresh()">Refresh</button>
    </div>
  </div>

  @if (error()) {
    <div class="alert danger-alert">{{ error() }}</div>
  }
  <div class="container-fluid text-center">
    <canvas class="bg-dark" style="width: 80%"> </canvas>
  </div>
  <div class="container text-center">
    <div class="row">
      <div class="container">
        <h1>Timeline</h1>
        <div class="border p-3">
          <div class="dropdown">
            <button
              type="button"
              class="btn btn-secondary dropdown-toggle"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Add Action
            </button>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Enable sprite</a></li>
              <li><a class="dropdown-item" href="#">Disable sprite</a></li>
              <li><a class="dropdown-item" href="#">Enable textbox</a></li>
              <li><a class="dropdown-item" href="#">Disable textbox</a></li>
              <li><a class="dropdown-item" href="#">Enable choice menu</a></li>
              <li><a class="dropdown-item" href="#">Disable choice menu</a></li>
            </ul>
          </div>
        </div>
        <div class="container">
          <h1>Manage variables</h1>
        </div>
      </div>
    </div>
