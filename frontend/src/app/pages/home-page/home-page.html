<div class="container-fluid">
  <!-- new project button(scenes) -->
  <div class="container">
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#newProjectModal"
    >
      New project
    </button>
  </div>
  <div
    class="modal fade"
    id="newProjectModal"
    tabindex="-1"
    aria-labelledby="Edit project"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="editModalLabel">Create project</h1>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="project-name" class="col-form-label">Project name</label>
              <input
                type="text"
                class="form-control"
                id="projectTitle"
                placeholder="title"
                [value]="newTitle()"
                (input)="newTitle.set(onTextInput($event))"
              />
            </div>
            <div class="mb-3">
              <label for="project-name" class="col-form-label">Description</label>
              <textarea
                class="form-control"
                id="projectDescription"
                placeholder="description"
                [value]="newDescription()"
                (input)="newDescription.set(onTextInput($event))"
              ></textarea>
              @if (error()) {
                <div class="alert alert-danger">{{ error() }}</div>
              }
            </div>
          </form>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
              [disabled]="!canCreate()"
              (click)="createProject()"
            >
              Create
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="container">
      <div class="row">
        <h3>Recent projects</h3>
      </div>
      <div class="row">
        <div class="container">
          <button [disabled]="loading()" (click)="refresh()">Refresh</button>
        </div>
      </div>
      @if (projects() === null) {
        <div class="spinner-grow" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      } @else if (projects()!.length === 0) {
        <div class="alert alert-secondary">No recent projects yet.</div>
      } @else {
        <div class="container text-center">
          <div class="row"> 
            @for (p of projects()!; track p.id) {
              <div class="card">
                <div class="card-body">
                  <h3 class="card-title">{{ p.title }}</h3>
                  <p class="card-text">{{ p.description ?? '—' }}</p>
                  <a [routerLink]="['/projects', p.id]"><button>Open</button></a>
                  <a [routerLink]="['/play', p.id]"><button>Play</button></a>
                  <button class="danger" (click)="deleteProject(p.id)">Delete</button>
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</div>
