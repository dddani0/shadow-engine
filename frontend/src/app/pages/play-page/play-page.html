<div class="container">
  <h1>{{ this.projectName() }}</h1>
  <div class="btn-group">
    <button
      [routerLink]="['/projects', projectId()]"
      type="button"
      class="btn btn-outline-secondary"
    >
      Edit
    </button>
    <button [disabled]="loading()" (click)="restart()" type="button" class="btn btn-outline-danger">
      Reset
    </button>
  </div>
  <br />
  <div style="height: 500px">
    <div class="container-sm h-100 d-inline-block border border-5 border-danger bg-secondary">
      @if (this.currentAction() !== null) {
        {{ this.currentAction()?.type }}
        @switch (this.currentAction()?.type) {
          @case ('EnableTextbox') {
            THIS IS A TEXTBOX
            <p>{{ this.currentComponent()?.textBox?.title }}</p>
          }
          @default {}
        }
      }
    </div>
  </div>
</div>
